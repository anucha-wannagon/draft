<!DOCTYPE html>
<html lang="en" data-theme="vivid">
<head>
<meta charset="utf-8"><meta name="viewport" content="width=device-width, initial-scale=1, maximum-scale=1, user-scalable=no, viewport-fit=cover">
<title>FlowStudio - Process and role diagrams</title>
<link rel="manifest" href="manifest.json">
<meta name="theme-color" content="#14346B">
<link rel="icon" href="icon.svg">
<link rel="stylesheet" href="assets/hd-theme.css">
<script src="assets/hd-fonts.js"></script>
<script src="assets/hd-logos.js"></script>
<script src="assets/hd-shell.js"></script>
<script src="flow-core.js"></script>
<script src="samples.js"></script>
<style>
body{margin:0}
/* editor view: remove the page padding so the canvas gets the whole area */
.hs-wrap.fs-editor{padding:8px 10px 8px;max-width:none}
.fs-wrap{display:flex;gap:8px;height:70vh;min-height:360px}
/* ---- left tool rail ---- */
.fs-tools{width:140px;flex:none;display:flex;flex-direction:column;gap:4px;overflow:visible;padding-right:2px}
.fs-tools .dd{position:relative;display:block}
.fs-tools .menu{display:none;position:absolute;left:0;top:38px;background:var(--card);border:1px solid var(--line);border-radius:10px;box-shadow:0 6px 20px rgba(0,0,0,.15);padding:6px;min-width:190px;z-index:7}
.fs-tools .menu.on{display:block}
.fs-tools .menu button{border:0;border-radius:7px;background:transparent}
.fs-tools .menu button:hover{background:var(--bg2)}
.fs-tools h4{margin:4px 0 1px;font-size:12px;color:var(--muted);font-weight:500}
.fs-tools button,.fs-bar button{display:flex;align-items:center;gap:7px;width:100%;border:1px solid var(--line);background:var(--card);border-radius:9px;padding:5px 9px;cursor:pointer;color:var(--ink);text-align:left;font-size:13.5px;min-height:34px}
.fs-tools button.on{background:color-mix(in srgb,var(--tc,var(--c-primary)) 16%,white);border-color:var(--tc,var(--c-primary));color:var(--tc,var(--c-primary));font-weight:500}
.fs-tools button .sw{width:18px;height:18px;border-radius:5px;flex:none;border:2px solid var(--tc);background:color-mix(in srgb,var(--tc) 18%,white)}
.fs-tools button .sw.cap{border-radius:9px}.fs-tools button .sw.dia{transform:rotate(45deg) scale(.8)}.fs-tools button .sw.note{border-style:dashed}.fs-tools button .sw.lane{width:22px;height:14px}.fs-tools button .sw.circ{border-radius:50%}
/* ---- stage ---- */
.fs-stage{flex:1;min-width:0;position:relative;border:1px solid var(--line);border-radius:12px;background:var(--card);overflow:hidden;touch-action:none}
.fs-stage svg.main{width:100%;height:100%;display:block;cursor:default}
.fs-bar{position:absolute;left:8px;right:8px;top:8px;display:flex;gap:5px;flex-wrap:wrap;z-index:3;align-items:center}
.fs-bar button{width:auto;min-height:34px;padding:4px 10px;background:color-mix(in srgb,var(--card) 94%,transparent);box-shadow:0 1px 4px rgba(0,0,0,.08)}
.fs-bar button.hot{background:var(--c-primary);color:#fff;border-color:var(--c-primary);font-weight:500}
.fs-bar button.pp{margin-left:auto;display:none}
.fs-bar .sep{width:1px;height:22px;background:var(--line);margin:0 2px}
.fs-bar .zv{font-size:13px;color:var(--muted);min-width:40px;text-align:center}
.fs-bar .dd{position:relative}
.fs-bar .menu{display:none;position:absolute;left:0;top:38px;background:var(--card);border:1px solid var(--line);border-radius:10px;box-shadow:0 6px 20px rgba(0,0,0,.15);padding:6px;min-width:200px;z-index:5}
.fs-bar .menu.on{display:block}
.fs-bar .menu button{width:100%;box-shadow:none;border:0;border-radius:7px;background:transparent}
.fs-bar .menu button:hover{background:var(--bg2)}
.fs-status{position:absolute;left:10px;bottom:8px;font-size:13px;color:var(--muted);background:color-mix(in srgb,var(--card) 90%,transparent);padding:2px 8px;border-radius:8px;z-index:3;max-width:70%;white-space:nowrap;overflow:hidden;text-overflow:ellipsis}
.fs-msg{position:absolute;right:10px;bottom:8px;font-size:14px;color:#fff;background:var(--c-green);padding:4px 12px;border-radius:8px;z-index:3;display:none}
/* ---- right properties panel (compact, PowerPoint-style sections) ---- */
.fs-props{width:232px;flex:none;overflow-y:auto;display:flex;flex-direction:column;gap:6px;padding-left:2px;font-size:13px}
.fs-props .ph{font-size:13px;font-weight:600;color:var(--c-navy);padding:4px 6px 0}
.fs-props .sec{background:var(--card);border:1px solid var(--line);border-radius:10px;overflow:hidden}
.fs-props .sec summary{cursor:pointer;list-style:none;display:flex;align-items:center;gap:6px;padding:7px 10px;font-size:13px;font-weight:500;color:var(--ink);background:color-mix(in srgb,var(--c-primary) 6%,var(--card));user-select:none}
.fs-props .sec summary::-webkit-details-marker{display:none}
.fs-props .sec summary::before{content:"▸";font-size:11px;color:var(--muted);width:10px}
.fs-props .sec[open] summary::before{content:"▾"}
.fs-props .sb{padding:6px 10px 9px;display:flex;flex-direction:column;gap:5px}
.fs-props label{display:block;font-size:12px;color:var(--muted);min-width:0}
.fs-props label.ck{display:flex;align-items:center;gap:4px;align-self:end;padding-bottom:6px;white-space:nowrap}
.fs-props input[type=text],.fs-props textarea,.fs-props select,.fs-props input[type=number]{width:100%;box-sizing:border-box;border:1px solid var(--line);border-radius:7px;padding:4px 7px;font-size:13px;background:var(--card);color:var(--ink);margin-top:2px}
.fs-props textarea{min-height:44px;resize:vertical}
.fs-props .row{display:flex;gap:5px}.fs-props .row>*{flex:1;min-width:0}
.fs-props button{display:flex;align-items:center;justify-content:center;gap:5px;width:100%;border:1px solid var(--line);background:var(--card);border-radius:7px;padding:4px 7px;cursor:pointer;color:var(--ink);font-size:12.5px;min-height:30px}
.fs-props button.on{background:color-mix(in srgb,var(--c-primary) 16%,white);border-color:var(--c-primary);color:var(--c-primary)}
.fs-props button.danger{color:var(--c-red);border-color:color-mix(in srgb,var(--c-red) 40%,white)}
.fs-props .swatches{display:flex;flex-wrap:wrap;gap:4px}
.fs-props .swatches span{width:22px;height:22px;border-radius:6px;cursor:pointer;border:2px solid transparent}
.fs-props .swatches span.on{border-color:var(--ink);box-shadow:0 0 0 2px #fff inset}
.fs-props .hint{font-size:12px;color:var(--muted);margin:0;line-height:1.4}
.fs-props .st{display:grid;grid-template-columns:1fr 28px 52px 28px;align-items:center;gap:3px}
.fs-props .st .sl{font-size:12px;color:var(--muted)}
.fs-props .st button{width:28px;min-height:28px;padding:0;font-size:16px;line-height:1}
.fs-props .st .sv{text-align:center;font-size:12.5px}
.fs-props .pclose{display:none;float:right;width:28px;min-height:28px;padding:0;border-radius:7px;font-size:17px;margin:-2px -4px 0 0}
/* ---- pen tray (shown while Pen / Eraser is active) ---- */
.fs-pen{position:absolute;left:8px;right:8px;top:52px;z-index:3;display:flex;gap:5px;align-items:center;flex-wrap:wrap;background:color-mix(in srgb,var(--card) 94%,transparent);border:1px solid var(--line);border-radius:10px;padding:5px 8px;box-shadow:0 1px 4px rgba(0,0,0,.08)}
.fs-pen[hidden]{display:none}
.fs-pen .lab{font-size:13px;color:var(--muted);margin-right:4px}
.fs-pen button{display:inline-flex;align-items:center;justify-content:center;min-width:34px;height:34px;border:1px solid var(--line);background:var(--card);border-radius:8px;cursor:pointer;padding:0 8px;font-size:14px;color:var(--ink);gap:4px}
.fs-pen button.on{border-color:var(--c-primary);box-shadow:0 0 0 1.5px var(--c-primary) inset}
.fs-pen button i{display:block;border-radius:50%;background:currentColor}
.fs-pen button.swb i{width:18px;height:18px;background:var(--sc);box-shadow:0 0 0 1.5px rgba(0,0,0,.12)}
.fs-pen .sep{width:1px;height:22px;background:var(--line);margin:0 3px}
/* ---- context menu ---- */
.fs-ctx{font-family:"Kanit","Leelawadee UI",Tahoma,sans-serif;position:fixed;z-index:80;min-width:190px;background:var(--card);border:1px solid var(--line);border-radius:10px;box-shadow:0 8px 24px rgba(0,0,0,.18);padding:5px}
.fs-ctx[hidden]{display:none}
.fs-ctx button{display:block;width:100%;text-align:left;border:0;background:transparent;border-radius:7px;padding:7px 12px;font-size:14px;color:var(--ink);cursor:pointer;font-family:inherit}
.fs-ctx button:hover{background:var(--bg2)}
.fs-ctx button:disabled{color:var(--muted);cursor:default}
.fs-ctx hr{border:0;border-top:1px solid var(--line);margin:4px 2px}
/* ---- scrollbars ---- */
.fs-sb{position:absolute;z-index:4;touch-action:none;background:color-mix(in srgb,var(--line) 45%,transparent);border-radius:8px}
.fs-sb[hidden]{display:none}
.fs-sb.v{top:50px;bottom:36px;right:4px;width:14px}
.fs-sb.h{left:8px;right:24px;bottom:4px;height:14px}
.fs-sb i{position:absolute;border-radius:7px;background:var(--c-navy);opacity:.45;cursor:grab}
.fs-sb.v i{left:2px;right:2px;min-height:40px}
.fs-sb.h i{top:2px;bottom:2px;min-width:40px}
.fs-sb.drag i,.fs-sb i:hover{opacity:.75}
.fs-status{bottom:20px}
/* ---- canvas content ---- */
.fs-node{font-family:"Kanit","Leelawadee UI",Tahoma,sans-serif;font-size:16px;line-height:1.3;color:var(--ink);display:flex;align-items:center;justify-content:center;text-align:center;height:100%;box-sizing:border-box;padding:6px 10px;word-break:break-word;overflow:hidden}
.fs-node b{font-weight:600}.fs-node small{display:block;font-size:14px;color:var(--muted);margin-top:2px}
.fs-node.lane{align-items:flex-start;justify-content:flex-start;font-weight:600;font-size:16px;padding:8px 12px}
.fs-node.note{align-items:flex-start;justify-content:flex-start;text-align:left;font-size:14px}
.fs-node.dk{color:#fff}.fs-node.dk small{color:rgba(255,255,255,.85)}
.fs-sel{fill:none;stroke:var(--c-primary);stroke-width:1.5;stroke-dasharray:5 4;pointer-events:none}
.fs-handle{fill:#fff;stroke:var(--c-primary);stroke-width:1.5;cursor:nwse-resize}
.fs-port{fill:var(--c-primary);stroke:#fff;stroke-width:1.5;cursor:crosshair}
.fs-edge-hit{fill:none;stroke:transparent;stroke-width:16;cursor:pointer}
.fs-elabel{font-family:"Kanit",sans-serif;font-size:14px;fill:var(--ink)}
.fs-elabelbg{fill:var(--card);stroke:var(--line);stroke-width:.5;rx:4}
.fs-marquee{fill:color-mix(in srgb,var(--c-primary) 10%,transparent);stroke:var(--c-primary);stroke-dasharray:4 3}
.fs-grid line{stroke:var(--line);stroke-width:.5}
/* ---- other pages ---- */
.fs-list{display:grid;grid-template-columns:repeat(auto-fill,minmax(260px,1fr));gap:12px}
.fs-list .it{background:var(--card);border:1px solid var(--line);border-radius:12px;padding:12px 14px}
.fs-list .it b{display:block;font-size:16px;color:var(--c-navy)}.fs-list .it small{color:var(--muted)}
.fs-list .it .act{display:flex;gap:6px;margin-top:8px}.fs-list .it .act button{border:1px solid var(--line);background:var(--bg2);border-radius:8px;padding:5px 10px;cursor:pointer;font-size:14px}
.hs-card pre{background:var(--bg2);border-radius:10px;padding:10px 12px;font-size:13px;overflow:auto}
/* ---- compact layout: tablets, narrow windows ---- */
@media (max-width:1366px) and (min-width:761px){
  .hs .hs-side{width:64px;flex:0 0 64px}
  .hs .hs-brand{padding:12px 13px;justify-content:center}.hs .hs-brand>div{display:none}
  .hs .hs-nav{padding:8px 6px}.hs .hs-nav button{font-size:0;justify-content:center;padding:8px 0;gap:0}
  .hs .hs-top{padding:8px 12px 12px}
}
@media (max-width:1366px){
  .fs-tools{width:48px;gap:3px}
  .fs-tools .menu{left:48px;top:0}
  .fs-tools h4{font-size:0;height:1px;background:var(--line);margin:4px 2px}
  .fs-tools button{width:44px;height:44px;min-height:44px;padding:0;justify-content:center;gap:0}
  .fs-tools button .lb{display:none}
  .fs-bar button .lb{display:none}
  .fs-bar button{min-height:40px;min-width:40px;justify-content:center;padding:4px 9px}
}
@media (max-width:1000px){
  .fs-props{display:none}
  .fs-bar button.pp{display:flex}
  .fs-wrap.panel .fs-props{display:flex;position:absolute;right:8px;top:56px;bottom:8px;width:min(320px,80vw);z-index:6;background:var(--bg);border:1px solid var(--line);border-radius:12px;padding:8px;box-shadow:0 8px 28px rgba(0,0,0,.2)}
  .fs-wrap.panel .fs-props .pclose{display:flex}
  .fs-wrap{position:relative}
}
@media (max-width:560px){
  .fs-wrap{flex-direction:column}
  .fs-tools{width:auto;flex-direction:row;overflow-x:auto;overflow-y:hidden;flex:none;padding:2px 0}
  .fs-tools h4{width:1px;height:auto;margin:2px 3px;flex:none}
  .fs-tools button{flex:none}
}
</style>
</head>
<body>
<script>
HDShell.init({
  key:"flowstudio", lang:"en", brand:["Flow","Studio"], tagline:"Process and role diagrams", home:"editor", brandIcon:"grid",
  logoLibrary:["mtec","nstda","mhesi","eow"],
  views:[
    {id:"editor",label:"Editor",icon:"grid",color:"c-primary",render:el=>FS.renderEditor(el)},
    {id:"files",label:"Files and samples",icon:"file",color:"c-green",render:el=>FS.renderFiles(el)},
    {id:"claude",label:"Paste from Claude",icon:"chat",color:"c-orange",render:el=>FS.renderPaste(el)},
    {id:"help",label:"Help and file format",icon:"info",color:"c-purple",render:el=>FS.renderHelp(el)}
  ]});
if("serviceWorker" in navigator && location.protocol.startsWith("http")) navigator.serviceWorker.register("sw.js").catch(()=>{});
</script>
</body></html>
